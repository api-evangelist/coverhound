aid: coverhound
name: CoverHound
description: 'CoverHound is an InsurTech marketplace, now part of Brown & Brown, Inc.
  (NYSE: BRO), that lets consumers and small businesses compare and buy insurance online
  from A-rated carriers across all 50 states. Its platform covers personal lines —
  auto, homeowners, and renters — alongside business insurance including general liability,
  workers'' compensation, professional liability, commercial auto, cyber, and directors
  & officers coverage. Founded in 2010 and headquartered in Carpinteria, California,
  CoverHound provides digital quote comparison, agent-assisted purchasing, and an insurance
  learning center. It operates as a consumer/SMB web marketplace and publishes no public
  developer program, API, or technical documentation surface.'
